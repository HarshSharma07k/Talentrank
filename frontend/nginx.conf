# See ../.claude/enhancements/14-containerization.md.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed filenames under /assets/ -- a given hash's
    # content never changes, so it's safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html references the current build's hashed asset names, so it must
    # always be revalidated -- caching it would pin visitors to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # react-router client-side routes (e.g. /how-it-works) have no matching file
    # on disk; without this fallback, reloading anything but "/" 404s.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
