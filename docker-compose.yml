# See .claude/enhancements/14-containerization.md.
#
# `docker compose up --build`            -- api + web, in-process cache.
# `docker compose --profile redis up --build` -- adds a redis container; the api
#   service always points at it (TALENTRANK_CACHE_BACKEND=redis below), and
#   get_cache_backend() (src/talentrank/cache.py) already falls back to
#   in-memory if that connection fails -- which is exactly what happens when the
#   redis profile isn't active and the "redis" hostname doesn't resolve. So the
#   profile flag alone is what actually toggles the backend; no second variable
#   to keep in sync. /health's cache_backend field reports whichever backend
#   this fallback actually resolved to, not just what's configured.
#
#   Caveat measured while verifying this: get_cache_backend() is an
#   @lru_cache(maxsize=1) singleton resolved on first use per process, and
#   compose leaves an already-running, unchanged `api` container alone when you
#   add `--profile redis` to a second `up`. So switching from the first command
#   above straight to the second, without an `api` restart in between, leaves
#   the *already-running* api process pinned to whatever it resolved before
#   redis existed -- /health will still say "memory" until that process
#   restarts (`docker compose --profile redis up --build --force-recreate api`,
#   or a `down` first). Starting straight from `--profile redis up --build` on
#   a clean stack does not hit this, since the singleton then resolves for the
#   first time with redis already reachable.
#
# Compose auto-loads a project-root .env for ${VAR} substitution below. Unlike
# every other variable here, POSTGRES_PASSWORD has no default (the `:?` syntax
# below) -- enhancements/24: "credentials come from the env-file, never from a
# literal in the compose file," and a database service is no longer optional once
# accounts exist, so `docker compose up` refuses to start without one rather than
# silently picking a guessable default. Copy .env.example to .env and set it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-talentrank}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env -- see .env.example}
      - POSTGRES_DB=${POSTGRES_DB:-talentrank}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Not just "is the process up" -- pg_isready confirms Postgres is actually
      # accepting connections. Without this as the api service's depends_on
      # condition, the api container wins the startup race roughly half the time
      # and dies attempting its first connection.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentrank}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    ports:
      - "${TALENTRANK_API_PORT:-8000}:7860"
    environment:
      - TALENTRANK_CORPUS_PROFILE=demo
      - TALENTRANK_CACHE_BACKEND=redis
      - TALENTRANK_REDIS_URL=redis://redis:6379/0
      - TALENTRANK_CORS_ALLOWED_ORIGINS=${TALENTRANK_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # asyncpg, not psycopg -- the async driver this project's SQLAlchemy engine
      # is pinned to (enhancements/19). Same credentials the postgres service
      # above was given, read from the same .env, never duplicated as a literal.
      - TALENTRANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-talentrank}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env -- see .env.example}@postgres:5432/${POSTGRES_DB:-talentrank}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Local dev convenience: data/ changes (a re-run of prep_data.py etc.)
      # show up on container restart without an image rebuild. Read-only --
      # nothing in the app writes under data/ on this path (see enhancements/07's
      # finding-3 fix: the embedding cache write path is never hit at use_cache=False).
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${TALENTRANK_API_PORT:-8000}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Wired in but off by default -- see 00-overview.md's confirmed product
    # decisions. Only started by `docker compose --profile redis up`.
    profiles: ["redis"]

volumes:
  # Named, not bind-mounted: `docker compose down -v` is the deliberate way to
  # discard it (enhancements/24's own verification calls for proving accounts
  # survive `restart` and a plain `down && up`, and separately for proving a
  # `down -v` first genuinely starts from empty rather than reusing a volume
  # created back when something else was broken).
  postgres_data:
